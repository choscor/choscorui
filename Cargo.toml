[workspace]
members = ["crates/choscorui", "crates/choscorui-core", "crates/choscorui-controls", "crates/choscorui-compose", "crates/choscorui-linux", "crates/choscorui-macos", "crates/choscorui-windows", "crates/choscorui-render", "gallery", "tools/bench"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# One codegen unit with whole-program LTO keeps the release executables
# inside the size budget in docs/performance.md.
[profile.release]
lto = true
codegen-units = 1

[workspace]
members = ["crates/choscorui", "crates/choscorui-core", "crates/choscorui-controls", "crates/choscorui-compose", "crates/choscorui-linux", "crates/choscorui-macos", "crates/choscorui-windows", "crates/choscorui-render", "gallery", "tools/api-docs", "tools/bench"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# One codegen unit with whole-program LTO, no symbol table, and size
# optimization for the view code and the controls keep the release
# executables inside the size budget in docs/performance.md. Core and the
# backend keep full optimization for the paint, layout, and input paths.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.release.package.choscorui-compose]
opt-level = "z"

[profile.release.package.choscorui-controls]
opt-level = "s"

# This override drops the inherited `strip`, so it sets it again.
[profile.release.package.choscorui-gallery]
opt-level = "z"
strip = "symbols"
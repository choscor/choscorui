version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      cargo-weekly:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /samples/notes
    schedule:
      interval: weekly
      day: monday
      time: '04:10'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      samples-notes-weekly:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      actions-weekly:
        patterns: ['*']

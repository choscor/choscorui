# Diagnostic workflow (do not merge).
name: ci

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  diag:
    runs-on: macos-15
    env:
      NSZombieEnabled: "YES"
      MallocScribble: "1"
      NSDeallocateZombies: "YES"
      CHOSCORUI_RUN_MACOS_SMOKE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo test -p choscorui-macos --test lifetime_smoke --locked --no-run
      - name: All
        run: cargo test -p choscorui-macos --test lifetime_smoke --locked
      - name: Churn
        run: DIAG_ONLY=churn cargo test -p choscorui-macos --test lifetime_smoke --locked
      - name: Storm
        run: DIAG_ONLY=storm cargo test -p choscorui-macos --test lifetime_smoke --locked
      - name: Other
        run: DIAG_ONLY=other cargo test -p choscorui-macos --test lifetime_smoke --locked

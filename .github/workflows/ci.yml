# Diagnostic workflow (do not merge).
name: ci

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  diag:
    runs-on: macos-15
    env:
      NSZombieEnabled: "YES"
      MallocScribble: "1"
      NSDeallocateZombies: "YES"
      CHOSCORUI_RUN_MACOS_SMOKE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo test -p choscorui-macos --test lifetime_smoke --locked --no-run
      - name: churn base
        run: DIAG_ONLY=churn  cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|IOSurface|panicked'
      - name: churn cg
        run: DIAG_ONLY=churn CHOSCORUI_PAINTER=core-graphics cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|IOSurface|panicked'
      - name: churn noshow
        run: DIAG_ONLY=churn DIAG_NOSHOW=1 cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|IOSurface|panicked'
      - name: churn noshow-cg
        run: DIAG_ONLY=churn DIAG_NOSHOW=1 CHOSCORUI_PAINTER=core-graphics cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|IOSurface|panicked'
      - name: churn all-cg
        run: DIAG_ONLY=churn CHOSCORUI_PAINTER=core-graphics DIAG_ONLY= cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|IOSurface|panicked'

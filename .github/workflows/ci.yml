# Diagnostic workflow (do not merge).
name: ci

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  diag:
    runs-on: macos-15
    env:
      NSZombieEnabled: "YES"
      MallocScribble: "1"
      NSDeallocateZombies: "YES"
      CHOSCORUI_RUN_MACOS_SMOKE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo test -p choscorui-macos --test lifetime_smoke --locked --no-run
      - name: churn base
        run: DIAG_ONLY=churn DIAG_FIX= cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|panicked'
      - name: churn early
        run: DIAG_ONLY=churn DIAG_FIX=early cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|panicked'
      - name: churn early-unhost
        run: DIAG_ONLY=churn DIAG_FIX=early,unhost cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|panicked'
      - name: churn early-contents-flush
        run: DIAG_ONLY=churn DIAG_FIX=early,contents,flush cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|panicked'
      - name: churn early-device
        run: DIAG_ONLY=churn DIAG_FIX=early,device cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|panicked'
      - name: churn notx
        run: DIAG_ONLY=churn DIAG_FIX=notx cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|panicked'
      - name: churn late-all
        run: DIAG_ONLY=churn DIAG_FIX=forget,contents,device,unhost,flush cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|panicked'
      - name: churn early-all
        run: DIAG_ONLY=churn DIAG_FIX=early,forget,contents,device,unhost,flush cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (round|grown)|Owned physical|panicked'

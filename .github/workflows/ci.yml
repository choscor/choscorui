# Diagnostic workflow (do not merge).
name: ci

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  diag:
    runs-on: macos-15
    env:
      NSZombieEnabled: "YES"
      MallocScribble: "1"
      NSDeallocateZombies: "YES"
      CHOSCORUI_RUN_MACOS_SMOKE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo test -p choscorui-macos --test lifetime_smoke --locked --no-run
      - name: churn base
        run: DIAG_ONLY=churn  cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (grown)|Owned physical|panicked|Shared with|B .*(IOSurface|CoreAnimation)$'
      - name: churn early-shrink
        run: DIAG_ONLY=churn DIAG_FIX=early,shrink cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (grown)|Owned physical|panicked|Shared with|B .*(IOSurface|CoreAnimation)$'
      - name: churn early-shrink-sleep
        run: DIAG_ONLY=churn DIAG_FIX=early,shrink,flush,sleep cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (grown)|Owned physical|panicked|Shared with|B .*(IOSurface|CoreAnimation)$'
      - name: churn early-unhost-flush-sleep
        run: DIAG_ONLY=churn DIAG_FIX=early,unhost,flush,sleep cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (grown)|Owned physical|panicked|Shared with|B .*(IOSurface|CoreAnimation)$'
      - name: churn early-all-sleep
        run: DIAG_ONLY=churn DIAG_FIX=early,forget,contents,device,unhost,flush,sleep cargo test -p choscorui-macos --test lifetime_smoke --locked 2>&1 | grep -E 'DIAG (grown)|Owned physical|panicked|Shared with|B .*(IOSurface|CoreAnimation)$'

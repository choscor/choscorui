[package]
name = "choscorui"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe facade of the ChoscorUI desktop UI toolkit"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[dependencies]
choscorui-compose = { path = "../choscorui-compose", version = "0.2.0" }
choscorui-controls = { path = "../choscorui-controls", version = "0.2.0" }
choscorui-core = { path = "../choscorui-core", version = "0.2.0" }

[target.'cfg(target_os = "macos")'.dependencies]
choscorui-macos = { path = "../choscorui-macos", version = "0.2.0" }

[target.'cfg(target_os = "linux")'.dependencies]
choscorui-linux = { path = "../choscorui-linux", version = "0.2.0" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dev-dependencies]
choscorui-render = { path = "../choscorui-render" }

[[test]]
name = "app_smoke"
path = "tests/app_smoke.rs"
harness = false

[[test]]
name = "chrome_smoke"
path = "tests/chrome_smoke.rs"
harness = false

[[test]]
name = "metal_parity_smoke"
path = "tests/metal_parity_smoke.rs"
harness = false

[[test]]
name = "gles_parity_smoke"
path = "tests/gles_parity_smoke.rs"
harness = false

[[test]]
name = "display_lost_smoke"
path = "tests/display_lost_smoke.rs"
harness = false

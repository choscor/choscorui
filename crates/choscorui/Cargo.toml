[package]
name = "choscorui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe facade of the ChoscorUI desktop UI toolkit"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[dependencies]
choscorui-compose = { path = "../choscorui-compose", version = "0.1.0" }
choscorui-controls = { path = "../choscorui-controls", version = "0.1.0" }
choscorui-core = { path = "../choscorui-core", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dependencies]
choscorui-macos = { path = "../choscorui-macos", version = "0.1.0" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
choscorui-render = { path = "../choscorui-render" }

[[test]]
name = "app_smoke"
path = "tests/app_smoke.rs"
harness = false

[[test]]
name = "metal_parity_smoke"
path = "tests/metal_parity_smoke.rs"
harness = false

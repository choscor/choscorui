[package]
name = "choscorui-macos"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AppKit backend of ChoscorUI. Its API is an implementation detail of the choscorui facade"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"

[dependencies]
choscorui-core = { path = "../choscorui-core", version = "0.2.0" }

[[test]]
name = "window_smoke"
path = "tests/window_smoke.rs"
harness = false

[[test]]
name = "clipboard_smoke"
path = "tests/clipboard_smoke.rs"
harness = false

[[test]]
name = "menu_smoke"
path = "tests/menu_smoke.rs"
harness = false

[[test]]
name = "lifetime_smoke"
path = "tests/lifetime_smoke.rs"
harness = false

[[test]]
name = "display_scale_smoke"
path = "tests/display_scale_smoke.rs"
harness = false

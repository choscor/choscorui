[package]
name = "choscorui-macos"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"

[dependencies]
choscorui-core = { path = "../choscorui-core" }

[[test]]
name = "window_smoke"
path = "tests/window_smoke.rs"
harness = false

[[test]]
name = "clipboard_smoke"
path = "tests/clipboard_smoke.rs"
harness = false

[[test]]
name = "menu_smoke"
path = "tests/menu_smoke.rs"
harness = false

[[test]]
name = "lifetime_smoke"
path = "tests/lifetime_smoke.rs"
harness = false

[[test]]
name = "display_scale_smoke"
path = "tests/display_scale_smoke.rs"
harness = false

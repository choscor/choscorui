[package]
name = "choscorui-gallery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Every choscorui control in one window, built on the safe facade alone"

[dependencies]
choscorui = { path = "../crates/choscorui" }

# The AT-SPI smoke test reads the gallery with the D-Bus binding.
[target.'cfg(target_os = "linux")'.dev-dependencies]
choscorui-linux = { path = "../crates/choscorui-linux" }
